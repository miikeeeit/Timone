[project]
name = "timone"
version = "0.1.0"
description = "Timone — motore di esecuzione disciplinata di strategie d'investimento (Fase 1, paper trading)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mike" }]
dependencies = [
    "alpaca-py>=0.33",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Ponte con la PWA (Àncora da mobile, notifiche push): serve solo se si
# configura FIREBASE_SERVICE_ACCOUNT. Senza, il motore ignora il ponte.
firebase = [
    "firebase-admin>=7.5",
]
# I test delle notifiche (tests/test_remote.py) importano firebase_admin.messaging,
# quindi l'ambiente di sviluppo lo include: `pip install -e '.[dev]'` -> suite completa.
dev = [
    "pytest>=8.0",
    "firebase-admin>=7.5",
]

[project.scripts]
timone = "timone.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
